<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFT POS - Acceso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-card">
        
        <!-- Panel Izquierdo: Branding y Estadísticas -->
        <section class="left-panel">
            <div class="logo-wrapper">
                <h1 class="logo-text">
                    <span class="soft-blue">SOFT</span> <span class="pos-dark">POS</span><span class="reg-mark">&reg;</span>
                </h1>
            </div>
            
            <div class="stats-box">
                <div class="stat-col">
                    <h3 class="stat-title">BEBIDAS MÁS VENDIDAS</h3>
                    <p class="stat-item">🍺 Cerveza Clara 355ML</p>
                    <p class="stat-item">🥤 Refresco Cola 355ML</p>
                </div>
                <div class="stat-col border-left">
                    <h3 class="stat-title">OTROS (PRODUCTOS) MÁS VENDIDOS</h3>
                    <p class="stat-empty">No hay datos para mostrar.</p>
                </div>
            </div>
        </section>

        <!-- Panel Derecho: Teclado -->
        <section class="right-panel">
            
            <!-- Franja Blanca: Input y Borrar -->
            <div class="numpad-header">
                <input type="password" id="pin-input" placeholder="CONTRASEÑA" readonly>
                <button id="btn-borrar">BORRAR</button>
            </div>
            
            <!-- Franja Azul: Teclado Numérico -->
            <div class="numpad-body">
                <button class="btn-num">7</button>
                <button class="btn-num">8</button>
                <button class="btn-num">9</button>
                <button class="btn-num">4</button>
                <button class="btn-num">5</button>
                <button class="btn-num">6</button>
                <button class="btn-num">1</button>
                <button class="btn-num">2</button>
                <button class="btn-num">3</button>
                
                <!-- Botón de icono 1234 -->
                <button class="btn-icon">
                    <div class="mini-numpad-icon">
                        <span>1</span><span>2</span>
                        <span>3</span><span>4</span>
                    </div>
                </button>
                
                <button class="btn-num">0</button>
                <button class="btn-cancel" id="btn-cancelar">✖</button>
            </div>
            
            <!-- Franja Verde: Entrar -->
            <div class="numpad-footer" id="btn-entrar">
                👤 ENTRAR
            </div>
            
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
