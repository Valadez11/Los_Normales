<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFT POS - Punto de Venta</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <div class="login-card"> <section class="left-panel">
            <div class="scanner-header">
                <h2 class="section-title">ESCÁNER DE PRODUCTOS</h2>
            </div>
            
            <div id="reader" class="camera-box"></div>
            
            <div class="manual-input-box">
                <input type="text" id="barcode-input" placeholder="O INGRESE CÓDIGO MANUAL" autocomplete="off">
                <button id="btn-buscar" class="btn-blue">BUSCAR</button>
            </div>
        </section>

        <section class="right-panel ticket-panel">
            <div class="ticket-header">
                <h2 class="section-title">TICKET DE VENTA</h2>
            </div>
            
            <div class="table-container">
                <table class="ticket-table">
                    <thead>
                        <tr>
                            <th>CANT</th>
                            <th>PRODUCTO</th>
                            <th>PRECIO</th>
                            <th>TOTAL</th>
                        </tr>
                    </thead>
                    <tbody id="cart-tbody">
                        </tbody>
                </table>
            </div>
            
            <div class="ticket-totals">
                <div class="total-row">
                    <span>SUBTOTAL:</span>
                    <span id="subtotal-text">$0.00</span>
                </div>
                <div class="total-row main-total">
                    <span>TOTAL A COBRAR:</span>
                    <span id="total-text">$0.00</span>
                </div>
            </div>
            
            <div class="numpad-footer" id="btn-cobrar">
                💰 COBRAR (F12)
            </div>
        </section>
    </div>
    <script src="ventas.js"></script>
</body>
</html>
